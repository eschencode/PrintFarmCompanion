[package]
name = "printfarm-companion-desktop"
version = "0.1.0"
description = "Print Farm Companion desktop shell"
authors = ["eschencode"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "printfarm_companion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = { version = "0.24", features = ["use-rustls"] }
tokio = { version = "1", features = ["time", "rt"] }
uuid = { version = "1", features = ["v4"] }
# Direct FTPS upload to Bambu printers (implicit TLS :990). native-tls matches the
# behaviour of the old Python client's OS ssl stack (TLS session reuse on the data
# channel, which Bambu requires). `deprecated` enables connect_secure_implicit.
suppaftp = { version = "6", features = ["native-tls", "deprecated"] }
# Inspect the .3mf (a zip) to find the real internal gcode path for the print command.
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
